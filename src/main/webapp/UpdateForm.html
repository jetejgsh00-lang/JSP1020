<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DEPT 테이블 데이터 수정</title>
</head>
<body>
	<h3>DEPT 테이블 데이터 수정</h3>
	<form action="deptUpdate">
		<fieldset>
			<legend>DEPT 폼</legend>
			<ul>
				
					<li>
						<label for="dname">부서이름</label>
						<input type="text" name="dname">
					</li>
					<li>
						<label for="loc">부서위치</label>
						<input type="text" name="loc">
					</li>
					<li>
						<label for="deptno">수정할 부서번호</label>
						<input type="text" name="deptno" placeholder="해당 부서번호중에 선택하세요">
					</li>
					<li>
						<input type="submit" value="수정">
					</li>
				
				
			</ul>
		</fieldset>
	
	</form>

</body>
</html>
