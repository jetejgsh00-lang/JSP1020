<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dept 테이블에 데이터 저장</title>
</head>
<body>
	<h2>DEPT 테이블에 데이터 저장</h2>
	<form action="deptInsert" method="post"> <!-- url을 보냄 -->
		<fieldset>
			<legend>DEPT 폼</legend>
			<ul>
				<li>
					<label for="deptno">부서번호</label>
					<input type="text" name="deptno"> <!-- name속성이중요함 -->
				</li>
				<li>
					<label for="dname">부서이름</label>
					<input type="text" name="dname">
				</li>
				<li>
					<label for="loc">부서위치</label>
					<input type="text" name="loc">
				</li>
				
				<li>
				<input type="submit" value="저장">
				</li>
				
			</ul>
			
		</fieldset>
	</form>
</body>
</html>
