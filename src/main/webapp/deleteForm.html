<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>DEPT 테이블 데이터 삭제</title>
</head>
<body>
	<h3>DEPT 테이블 데이터 삭제</h3>
	<form action="deptDelete">
		<fieldset>
			<legend>DEPT 폼</legend>
			<ul>
					<li>
						<label for="deptno">삭제할 부서번호</label>
						<input type="number" name="deptno" placeholder="해당 부서번호중에 선택하세요">
					</li>
					<li>
						<input type="submit" value="삭제">
					</li>
			</ul>
		</fieldset>
	</form>
</body>
</html>
