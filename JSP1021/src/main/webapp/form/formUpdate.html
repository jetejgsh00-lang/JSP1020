<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>EMP 테이블 데이터 수정</title>
</head>
<body>
	<h3>EMP 테이블 데이터 수정</h3>
	<form action="/JSP1021/updateServlet" method="post">
		<fieldset>
			<ul>
				<li>
				<label for="job">직업</label>
				<input type="text" name="job" required>
				</li>
				
				<li>
				<label for="sal">급여</label>
				<input type="number" name="sal" required>
				</li>
				
				<li>
				<label for="comm">커미션</label>
				<input type="number" name="comm" required>
				</li>
				
				<li>
				<label for="empno">수정할 사원번호</label>
				<input type="number" name="empno" required>
				</li>
				
				<li>
				<input type="submit" value="수정">
				</li>
			</ul>
		
		</fieldset>
	
	</form>

</body>
</html>
